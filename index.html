 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a12">

  <title>Viraj Analyst | Official Channel</title>
  <meta name="description" content="Visit the official Viraj Analyst Telegram channel.">

  <!-- Meta Pixel Code -->
  <script>

  fbq('init', '1154712443647950');

  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1154712443647950&ev=PageView&noscript=1"
    alt="">
  </noscript>
  <!-- End Meta Pixel Code -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 15% 15%, #163c65 0%, transparent 42%),
        radial-gradient(ellipse at 85% 85%, #38205d 0%, transparent 40%),
        #080a12;
    }

    .orb {
      position: fixed;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      filter: blur(75px);
      opacity: .34;
      pointer-events: none;
    }

    .orb.one {
      top: 8%;
      left: -100px;
      background: #00c8ff;
    }

    .orb.two {
      bottom: 3%;
      right: -90px;
      background: #8b5cf6;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 390px;
      padding: 38px 25px 27px;
      text-align: center;
      border-radius: 27px;
      background: rgba(255, 255, 255, .065);
      border: 1px solid rgba(255, 255, 255, .19);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, .4),
        inset 0 1px 1px rgba(255, 255, 255, .12);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 27px;
      padding: 1px;
      background: linear-gradient(
        140deg,
        rgba(93, 220, 255, .75),
        transparent 36%,
        rgba(173, 115, 255, .65)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 23px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #fff;
      background: linear-gradient(135deg, #164e78, #493078);
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 0 30px rgba(77, 180, 255, .18);
    }

    .eyebrow {
      color: #9bdfff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    h1 {
      font-size: clamp(27px, 7vw, 34px);
      font-weight: 800;
      letter-spacing: -.8px;
      line-height: 1.15;
    }

    .accent {
      color: #9bdfff;
    }

    .description {
      margin: 14px auto 23px;
      max-width: 285px;
      color: #b9c1d2;
      font-size: 13px;
      line-height: 1.8;
    }

    .channel-tag {
display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 30px;
      background: rgba(255,255,255,.045);
      color: #e3e9f5;
      font-size: 11px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #72e7b2;
      box-shadow: 0 0 10px #72e7b2;
    }

    .join-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 15px;
      border-radius: 15px;
      text-decoration: none;
      color: #07111b;
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(105deg, #a7edff, #65c8ff);
      box-shadow:
        0 0 22px rgba(80, 190, 255, .23),
        inset 0 1px 0 rgba(255,255,255,.8);
      transition: transform .2s, box-shadow .2s;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(80,190,255,.4);
    }

    .join-btn:active {
      transform: scale(.98);
    }

    .telegram-icon {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .note {
      margin-top: 19px;
      color: #828ba0;
      font-size: 10px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 22px;
      padding-top: 17px;
      border-top: 1px solid rgba(255,255,255,.09);
      color: #778198;
      font-size: 10px;
      letter-spacing: 1px;
    }

    @media (max-width: 380px) {
      .card {
        padding: 31px 19px 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .join-btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="card">
    <div class="logo">VA</div>

    <div class="eyebrow">OFFICIAL TELEGRAM CHANNEL</div>

    <h1>VIRAJ <span class="accent">ANALYST</span></h1>

    <p class="description">
      Welcome to Viraj Analyst.
      Visit our official Telegram channel for the latest updates.
    </p>

    <div class="channel-tag">
      <span class="dot"></span>
      <span>Official Channel</span>
    </div>

    <a
      class="join-btn"
      id="joinButton"
      href="https://t.me/+d_chLZUqLzlmMzc1"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg class="telegram-icon" viewBox="0 0 24 24" fill="currentColor"
           aria-hidden="true">
        <path d="M21.8 3.2 18.5 20c-.25 1.18-.92 1.47-1.87.92l-5.17-3.81-2.5 2.41c-.28.28-.52.52-1.07.52l.37-5.26 9.57-8.65c.42-.37-.09-.58-.65-.21L5.36 13.36.25 11.76c-1.11-.35-1.13-1.11.23-1.64L20.5 2.5c.92-.34 1.73.22 1.3.7Z"/>
      </svg>
      JOIN CHANNEL NOW
    </a>

    <p class="note">
      By continuing, you'll open Telegram to view the channel.
    </p>

    <div class="footer">VIRAJ ANALYST &bull; OFFICIAL PAGE</div>
  </main>

  <script>
    (function () {
      const button = document.getElementById('joinButton');
      let clicked = false;

      button.addEventListener('click', function (event) {
        if (clicked) {
          event.preventDefault();
          return;
        }

        clicked = true;

        // Record the button click as a Subscribe event.
        // This does not confirm that the visitor joined Telegram.
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Subscribe');
        }

        // Allow the browser to open Telegram in a new tab.
        // Keep navigation working even if the Pixel is blocked.
        window.setTimeout(function () {
          clicked = false;
        }, 1500);
      });
    })();
  </script>
</body>
</html>
